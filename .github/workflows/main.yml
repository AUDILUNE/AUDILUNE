name: Build AUDILUNE Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python Pillow
        run: pip3 install Pillow

      - name: Download JieLi Toolchain and AC79 SDK
        run: |
          chmod +x tools/get_toolchain.sh
          ./tools/get_toolchain.sh
          git clone --depth 1 https://github.com "$HOME/fw-AC79_AIoT_SDK"

      - name: Build AUDILUNE .fwsc package
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain"
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          export JIELI_DOCKER=0
          python3 tools/build.py --release 1.0

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audilune-fwsc
          path: build/*.fwsc
